    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #05070a; /* Midnight Immersive Canvas */
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* Ambient Glow behind Album Art */
      .album-glow {
        position: relative;
      }
      .album-glow::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 110%;
        height: 110%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.15) 0%,
          rgba(255, 255, 255, 0) 70%
        );
        z-index: -1;
        border-radius: inherit;
        filter: blur(20px);
      }

      /* Play Button Glow */
      .play-button-glow {
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      }

      /* Custom Waveform Range Slider styling for Webkit */
      input[type='range'] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -5px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      input[type='range']::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: linear-gradient(
          to right,
          #ffffff 40%,
          rgba(255, 255, 255, 0.2) 40%
        );
        border-radius: 1px;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-between overflow-x-hidden antialiased selection:bg-primary/30"
  >
    <!-- Top App Bar -->
    <header
      class="w-full top-0 fixed bg-transparent flex justify-between items-center px-container-padding-mobile py-4 z-50 flat no shadows"
    >
      <button
        aria-label="Collapse"
        class="text-primary hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-transform"
      >
        <span class="material-symbols-outlined" style="font-size: 28px"
          >expand_more</span
        >
      </button>
      <h1
        class="font-headline-md-mobile text-headline-md-mobile text-primary font-bold tracking-tight"
      >
        Now Playing
      </h1>
      <button
        aria-label="Queue"
        class="text-primary hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-transform"
      >
        <span class="material-symbols-outlined" style="font-size: 24px"
          >queue_music</span
        >
      </button>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="flex-1 w-full max-w-[500px] flex flex-col items-center justify-center px-container-padding-mobile pt-24 pb-32 z-10"
    >
      <!-- Album Artwork Section -->
      <div
        class="w-full aspect-square max-w-[320px] mx-auto mb-10 album-glow rounded-[32px]"
      >
        <img
          alt="Monochrome silhouette of a person wearing a hoodie with a cat's head, set against a stark white background. The image has a moody, minimalist, and high-contrast digital art aesthetic."
          class="w-full h-full object-cover rounded-[32px] shadow-2xl"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGJZWpFrlwkV2LJ5zkHrfe6Q-5gdGnZ5zH7geJBm8P78gDQ45G0VnRmdVKDlKiKoqc7wIdBAi8uEhg8jdpZMXOZ72VWsqMtLYYeBJjd54xt9aY41iN65ARkYpIY0OOIAFjXxtBPF9TYrp6bpf5mq011-WBvOyIXc_MOp8NkXUnF15iebcBGFyEHje_l6PEchPO9W9nzM_IYe_Xs-FB7hnivfy_LHoctyKkcCQa6EfZLlcT1VZZhFSXo8kha0GUMb1WAVvAkmSOhYLZ"
        />
      </div>
      <!-- Track Information & Actions -->
      <div class="w-full flex items-center justify-between mb-8 px-2">
        <button
          aria-label="Like"
          class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-90"
        >
          <span class="material-symbols-outlined" style="font-size: 24px"
            >favorite_border</span
          >
        </button>
        <div class="flex flex-col items-center text-center px-4">
          <h2 class="font-display-lg text-display-lg text-primary mb-1">
            Unstable
          </h2>
          <p class="font-body-lg text-body-lg text-on-surface-variant">
            Mr. Kitty
          </p>
        </div>
        <button
          aria-label="More options"
          class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-90"
        >
          <span class="material-symbols-outlined" style="font-size: 24px"
            >more_horiz</span
          >
        </button>
      </div>
      <!-- Progress/Waveform Indicator -->
      <div class="w-full mb-10 px-2 flex flex-col gap-2">
        <!-- Simulated Waveform Track (Simplified with a styled range slider for interactivity, representing the waveform concept) -->
        <div class="w-full relative h-6 flex items-center">
          <input
            aria-label="Seek track"
            class="w-full z-10"
            max="100"
            min="0"
            type="range"
            value="38"
          />
          <!-- Visual representation of waveform behind the slider thumb could be added here using an SVG or repeated elements, but sticking to standard UI elements for simplicity and robustness in this isolated context -->
        </div>
        <div class="flex justify-between items-center w-full">
          <span
            class="font-label-caps text-label-caps text-on-surface-variant tracking-wider"
            >1:04</span
          >
          <span
            class="font-label-caps text-label-caps text-on-surface-variant tracking-wider"
            >2:52</span
          >
        </div>
      </div>
      <!-- Playback Controls -->
      <div
        class="w-full flex items-center justify-between px-4 max-w-[340px] mx-auto"
      >
        <button
          aria-label="Shuffle"
          class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-90"
        >
          <span class="material-symbols-outlined" style="font-size: 24px"
            >shuffle</span
          >
        </button>
        <button
          aria-label="Previous track"
          class="text-primary hover:opacity-80 transition-opacity cursor-pointer active:scale-90"
        >
          <span
            class="material-symbols-outlined"
            data-weight="fill"
            style="font-size: 36px"
            >skip_previous</span
          >
        </button>
        <!-- Primary Play Button -->
        <button
          aria-label="Play"
          class="w-20 h-20 bg-primary text-[#05070A] rounded-full flex items-center justify-center play-button-glow hover:scale-105 transition-transform active:scale-95 cursor-pointer"
        >
          <span
            class="material-symbols-outlined"
            style="font-size: 40px; font-variation-settings: 'FILL' 1"
            >play_arrow</span
          >
        </button>
        <button
          aria-label="Next track"
          class="text-primary hover:opacity-80 transition-opacity cursor-pointer active:scale-90"
        >
          <span
            class="material-symbols-outlined"
            data-weight="fill"
            style="font-size: 36px"
            >skip_next</span
          >
        </button>
        <button
          aria-label="Repeat"
          class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-90"
        >
          <span class="material-symbols-outlined" style="font-size: 24px"
            >repeat</span
          >
        </button>
      </div>
    </main>
    <!-- Bottom Navigation Bar (Predicted Component) -->
    <!-- Suppressed based on The Navigation Logic: Contextual State & Identity. Now Playing is a focused task/detail view, often reached from a mini-player or tracklist, implying a departure from global nav, prioritizing the canvas. -->
  </body>
</html>
